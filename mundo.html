<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Narrativo - Bosque Denso Low Poly</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene shadow="type: pcfsoft; autoUpdate: true">

    <a-assets>
      <!-- Aquí cargarás tus modelos GLB -->
      <!-- <a-asset-item id="animal-1" src="3d/zorro.glb"></a-asset-item> -->
    </a-assets>

    <!-- CIELO E ILUMINACIÓN MEJORADA -->
    <!-- Un azul más vibrante para contrastar con el verde -->
    <a-sky color="#4FC3F7"></a-sky>
    
    <a-light type="ambient" color="#B0BEC5" intensity="0.6"></a-light>
    <!-- Sol con sombras amplias para cubrir todo el bosque -->
    <a-light type="directional" color="#FFF9C4" intensity="0.8" position="20 30 15" 
             castShadow="true" shadow-mapSize="2048" 
             shadow-camera-right="50" shadow-camera-left="-50" 
             shadow-camera-top="50" shadow-camera-bottom="-50"></a-light>

    <!-- ========================================== -->
    <!-- TERRENO IRREGULAR Y RÍO                    -->
    <!-- ========================================== -->
    
    <!-- Base verde principal -->
    <a-plane rotation="-90 0 0" width="80" height="80" color="#7CB342" material="flatShading: true" shadow="receive: true"></a-plane>

    <!-- Colinas para romper la planicie (Conos achatados incrustados en el suelo) -->
    <a-cone position="-25 -2 -15" radius-bottom="20" height="6" segments-radial="8" color="#689F38" material="flatShading: true" shadow="receive: true"></a-cone>
    <a-cone position="30 -3 -25" radius-bottom="25" height="8" segments-radial="9" color="#689F38" material="flatShading: true" shadow="receive: true"></a-cone>
    <a-cone position="0 -1.5 15" radius-bottom="18" height="4" segments-radial="7" color="#8BC34A" material="flatShading: true" shadow="receive: true"></a-cone>

    <!-- Río más largo y detallado -->
    <a-entity position="0 0.1 0">
      <a-plane position="-20 0 -5" rotation="-90 65 0" width="70" height="3.5" color="#039BE5" material="flatShading: true"></a-plane>
      <a-plane position="-2 0 -2.5" rotation="-90 20 0" width="50" height="3.5" color="#039BE5" material="flatShading: true"></a-plane>
    </a-entity>

    <!-- MONTAÑAS GIGANTES DE FONDO -->
   <a-entity position="-10 0 -45">
      <!-- Altura 24 -> La posición en Y debe ser la mitad (12) -->
      <a-cone position="0 12 0" segments-radial="6" radius-bottom="14" height="24" color="#795548" material="flatShading: true" shadow="cast: true"></a-cone>
      <!-- Pico nevado ajustado a la cima -->
      <a-cone position="0 20 0" segments-radial="6" radius-bottom="5" height="8" color="#ECEFF1" material="flatShading: true"></a-cone>
    </a-entity>

    <a-entity position="10 0 -35">
      <a-cone position="0 10 0" segments-radial="5" radius-bottom="12" height="20" color="#5D4037" material="flatShading: true" shadow="cast: true"></a-cone>
      <a-cone position="0 17 0" segments-radial="5" radius-bottom="4" height="6" color="#ECEFF1" material="flatShading: true"></a-cone>
    </a-entity>

    <!-- ========================================== -->
    <!-- BARRERAS DE BOSQUE DENSO (Muros visuales)  -->
    <!-- ========================================== -->

    <!-- Muro de bosque Izquierdo cerca atras 
      -->
    <a-entity id="bosque-izquierdo" position="-35 0 4">
      <a-entity position="0 0 0"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 5 0" radius-bottom="1" height="2" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="4 0 -3" scale="0.8 0.8 0.8"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="-3 0 -4" scale="1.2 1.2 1.2"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#3E2723"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="7" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="7" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="5 0 2" scale="0.9 0.9 0.9"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="-1 0 -7" scale="1.1 1.1 1.1"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
    </a-entity>

    <!-- Muro de bosque Derecho -->
    <a-entity id="bosque-derecho" position="25 0 2">
      <a-entity position="0 0 0" scale="1.3 1.3 1.3"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="-4 0 -3" scale="0.8 0.8 0.8"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#43A047" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#43A047" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="3 0 -5" scale="1.1 1.1 1.1"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#3E2723"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="7" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="7" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="-6 0 2" scale="0.9 0.9 0.9"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="1 0 6"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
    </a-entity>

    <!-- Muro de bosque Fondo (Para tapar el horizonte detrás del río) -->
    <a-entity id="bosque-fondo" position="0 0 -25">
      <a-entity position="-15 0 0" scale="1.2 1.2 1.2"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="-20 0 -4"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="0 0 -2" scale="1.4 1.4 1.4"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#3E2723"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="20 0 -3" scale="0.9 0.9 0.9"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="5" color="#43A047" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="5" color="#43A047" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="15 0 -1" scale="1.1 1.1 1.1"><a-cylinder position="0 0.5 0" radius="0.3" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="2" height="2.5" segments-radial="6" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
    </a-entity>

    <!-- ========================================== -->
    <!-- ESTACIONES NARRATIVAS (Claros en el bosque)-->
    <!-- ========================================== -->

    <!-- ESTACIÓN 1: TIGRE (Cerca del río) -->

<a-assets>
  <img id="tugayt" src="3d/tugayt.png">
</a-assets>

<a-plane
  src="#tugayt"
  position="6 2 20"
  width="3"
  height="4"
  material="transparent: true"
  rotation="1 0 1"
></a-plane>



    <a-entity id="estacion-1" position="5 0 20">
      <!-- Grupo de árboles estilo bosque denso -->
      <a-entity position="-3 0 -2"><a-cylinder position="0 0.75 0" radius="0.25" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2.2 0" radius-bottom="2" height="2.2" segments-radial="6" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#388E3C" material="flatShading: true"></a-cone></a-entity>
      <a-entity position="2 0 -3"><a-cylinder position="0 0.75 0" radius="0.25" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2.2 0" radius-bottom="2" height="2.2" segments-radial="6" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.5" height="2" segments-radial="6" color="#2E7D32" material="flatShading: true"></a-cone></a-entity>
      <a-entity position="-1 0 2"><a-cylinder position="0 0.75 0" radius="0.25" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2.2 0" radius-bottom="2.2" height="2.2" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3.5 0" radius-bottom="1.6" height="2" segments-radial="6" color="#43A047" material="flatShading: true"></a-cone></a-entity>
      <!-- Pastos altos (pequeños cilindros verdes agrupados como hierba espesa) -->
      <a-cylinder position="-1.5 0.2 0" radius="0.08" height="0.6" color="#8BC34A" material="flatShading: true"></a-cylinder>
      <a-cylinder position="-1.3 0.25 0.3" radius="0.08" height="0.7" color="#689F38" material="flatShading: true"></a-cylinder>
      <a-cylinder position="-1.7 0.2 0.2" radius="0.08" height="0.5" color="#9CCC65" material="flatShading: true"></a-cylinder>
      <a-cylinder position="1 0.2 1" radius="0.08" height="0.65" color="#7CB342" material="flatShading: true"></a-cylinder>

       <a-text font="kelsonsans" value="Estacion Tigre" width="6" position="-2.8 5 -1.5"
              rotation="0 15 0"></a-text>
     
    </a-entity>
      <!-- ROCAS -->
      <a-icosahedron position="1.5 0.2 1" radius="0.4" color="#757575" material="flatShading: true" shadow="cast: true" rotation="10 45 0"></a-icosahedron>
      <a-icosahedron position="2 0.1 1.5" radius="0.2" color="#9E9E9E" material="flatShading: true" shadow="cast: true" rotation="0 20 10"></a-icosahedron>
>
      
    </a-entity>

    <!-- ESTACIÓN 2: ALCE (Cruzando el río) -->

<a-assets>
  <img id="tugayt" src="3d/tugayt.png">
</a-assets>

<a-plane
  src="#tugayt"
  position="6 2 20"
  width="3"
  height="4"
  material="transparent: true"
  rotation="1 0 1"
></a-plane>

    <a-entity id="estacion-2" position="-6 0 -12">
      <!-- Gran Árbol Central -->
      <a-entity position="0 0 0" scale="1.8 2.2 1.8">
        <a-cylinder position="0 1 0" radius="0.4" height="2" color="#3E2723" shadow="cast: true"></a-cylinder>
        <a-cone position="0 3 0" radius-bottom="2.5" height="2.5" segments-radial="7" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone>
        <a-cone position="0 4.5 0" radius-bottom="1.8" height="2.2" segments-radial="7" color="#2E7D32" material="flatShading: true" shadow="cast: true"></a-cone>
        <a-cone position="0 5.8 0" radius-bottom="1.1" height="1.8" segments-radial="7" color="#43A047" material="flatShading: true"></a-cone>
      </a-entity>
      <!-- Hierbas raras (formas geométricas de colores llamativos alrededor) -->
      <a-icosahedron position="1.5 0.2 1" radius="0.3" color="#AB47BC" material="flatShading: true" shadow="cast: true"></a-icosahedron>
      <a-box position="-1.5 0.2 1.2" width="0.3" height="0.4" depth="0.3" color="#26A69A" material="flatShading: true" rotation="0 45 0"></a-box>
      <a-tetrahedron position="0.8 0.3 -1.5" radius="0.35" color="#FFCA28" material="flatShading: true"></a-tetrahedron>
      <
    </a-entity>
    
      <a-text font="kelsonsans" value="Estacion Alce " width="6" position="-2 5 -10"
              rotation="0 0 0"></a-text>







      <!-- Troncos apilados -->
      <a-entity position="-2 0.15 2" rotation="0 35 0">
        <a-cylinder position="0 0 0" radius="0.15" height="1.2" rotation="90 0 0" segments-radial="6" color="#5D4037" material="flatShading: true" shadow="cast: true"></a-cylinder>
        <a-cylinder position="0.3 0 0" radius="0.15" height="1.2" rotation="90 0 0" segments-radial="6" color="#5D4037" material="flatShading: true" shadow="cast: true"></a-cylinder>
        <a-cylinder position="0.15 0.25 0" radius="0.15" height="1.2" rotation="90 0 0" segments-radial="6" color="#5D4037" material="flatShading: true" shadow="cast: true"></a-cylinder>
      </a-entity>

      <!-- ESPACIO RESERVADO PERSONAJE 2 -->
      <!-- <a-gltf-model src="#animal-2" position="0 0 0"></a-gltf-model> -->
    </a-entity>

    <!-- ESTACIÓN 3: El claro de la derecha -->
    <a-entity id="estacion-3" position="12 0 -7">
      <a-entity position="-3 0 1" scale="0.9 0.9 0.9"><a-cylinder position="0 0.5 0" radius="0.2" height="1.5" color="#4E342E"></a-cylinder><a-cone position="0 2 0" radius-bottom="1.8" height="2" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3 0" radius-bottom="1.4" height="1.8" segments-radial="6" color="#388E3C" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="2 0 -2" scale="1.2 1.2 1.2"><a-cylinder position="0 0.5 0" radius="0.2" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="1.8" height="2" segments-radial="5" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3 0" radius-bottom="1.4" height="1.8" segments-radial="5" color="#1B5E20" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>
      <a-entity position="1 0 3" scale="0.8 0.8 0.8"><a-cylinder position="0 0.5 0" radius="0.2" height="1.5" color="#5D4037"></a-cylinder><a-cone position="0 2 0" radius-bottom="1.8" height="2" segments-radial="7" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone><a-cone position="0 3 0" radius-bottom="1.4" height="1.8" segments-radial="7" color="#4CAF50" material="flatShading: true" shadow="cast: true"></a-cone></a-entity>

      <a-icosahedron position="-1 0.3 2" radius="0.5" color="#9E9E9E" material="flatShading: true" shadow="cast: true" rotation="15 0 20"></a-icosahedron>

      <!-- ESPACIO RESERVADO PERSONAJE 3 -->
      <!-- <a-gltf-model src="#animal-3" position="0 0 0"></a-gltf-model> -->
    </a-entity>

    <!-- NUBES Y LLUVIA -->
    <a-entity position="-15 15 -20">
      <a-icosahedron position="0 0 0" radius="2.5" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="2 0 1" radius="1.8" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="-2 -0.2 -1" radius="1.5" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
    </a-entity>

    <!-- Nube de lluvia central -->
    <a-entity position="5 18 -22">
      <a-icosahedron position="0 0 0" radius="2.5" color="#90A4AE" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="2 0 0" radius="1.8" color="#90A4AE" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="-1.8 -0.3 1" radius="1.6" color="#90A4AE" material="flatShading: true"></a-icosahedron>
      
      <!-- Gotas -->
      <a-cylinder position="0 -4 0" radius="0.05" height="1" color="#81D4FA" material="transparent: true; opacity: 0.6; flatShading: true"></a-cylinder>
      <a-cylinder position="1 -5 0.5" radius="0.05" height="1" color="#81D4FA" material="transparent: true; opacity: 0.6; flatShading: true"></a-cylinder>
      <a-cylinder position="-1 -3 -0.5" radius="0.05" height="1" color="#81D4FA" material="transparent: true; opacity: 0.6; flatShading: true"></a-cylinder>
    </a-entity>

    <a-entity position="20 12 -15" scale="0.7 0.7 0.7">
      <a-icosahedron position="0 0 0" radius="2.5" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="1.5 0.3 0.8" radius="1.8" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
      <a-icosahedron position="-1.5 -0.1 0" radius="1.6" color="#FFFFFF" material="flatShading: true"></a-icosahedron>
    </a-entity>

    <!-- CÁMARA INICIAL (Más cerca del suelo y un poco adelantada) -->
    <a-camera position="0 1.6 6" wasd-controls="acceleration: 65" look-controls>
      <a-cursor color="#FF5722"></a-cursor>
    </a-camera>

  </a-scene>
</body>
</html>
