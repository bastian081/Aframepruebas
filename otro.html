<html>
<head>
<meta charset="UTF-8">
<title>otro</title>
<link href="file:///Macintosh HD/Users/estudiantes/hoja.css" rel="stylesheet" type="text/css">
	    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script 
	AFRAME.registerComponent('enlace-click', {
  schema: {
    url: { type: 'string' }
  },
  init: function () {
    this.el.addEventListener('click', () => {
      window.location.href = this.data.url;
    });
  }
});
	
	></script>
	
</head>

<body>
<a-scene>

	
  <a-assets>
    <img id="boton2" src="img/cielo.jpg">
  </a-assets>

	<a-gltf-model
    src="modelo.glb"
    position="0 1.5 -3"
    enlace-click="url: otra-escena.html">
  </a-gltf-model>
  <a-link position="0 2 -4" href="index.html" title="A mi index" image="#boton2"></a-link>

	<a-camera>
    <a-cursor color="red"></a-cursor>
  </a-camera>
	
  <a-sky color="red"></a-sky>
<a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="green"></a-plane>
</a-scene>
</body>
</html>
